services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bus
      POSTGRES_PASSWORD: bus
      POSTGRES_DB: bustracker
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus -d bustracker"]
      interval: 5s
      retries: 10
  redis:            # not used until Phase 5; started now so the dev setup doesn't change later
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
